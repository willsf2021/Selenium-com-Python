{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Termômetro de Vaga</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f7fa;color:#333}
  .container{max-width:900px;margin:0 auto;padding:30px 20px}
  header{background:#2c3e50;color:white;padding:20px 0;margin-bottom:30px}
  header .container{display:flex;justify-content:space-between;align-items:center;padding:0 20px}
  h1{font-size:1.6rem} h1 a{color:white;text-decoration:none}
  h2{color:#2c3e50;margin:20px 0 15px}
  h3{color:#34495e;margin-bottom:15px}
  nav a{color:#ecf0f1;text-decoration:none;margin-left:20px}
  nav a:hover{color:#3498db}
  .card{background:white;border-radius:8px;padding:24px;margin-bottom:20px;box-shadow:0 2px 4px rgba(0,0,0,.05)}
  .btn{display:inline-block;padding:10px 20px;background:#3498db;color:white;border:none;border-radius:4px;cursor:pointer;text-decoration:none;font-size:1rem}
  .btn:hover{background:#2980b9}
  .btn-success{background:#27ae60} .btn-success:hover{background:#229954}
  .form-group{margin-bottom:15px}
  .form-group label{display:block;margin-bottom:5px;font-weight:500}
  .form-input,.form-select{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;font-size:1rem}
  .alert{padding:12px 16px;border-radius:4px;margin-bottom:10px}
  .alert-success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
  .alert-error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
  .alert-warning{background:#fff3cd;color:#856404;border:1px solid #ffeaa7}
  .fila-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #eee}
  .fila-item:last-child{border-bottom:none}
  .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.85rem;font-weight:500}
  .badge-cotista{background:#f39c12;color:white}
  .badge-ampla{background:#95a5a6;color:white}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}
  .stat{background:white;padding:20px;border-radius:8px;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.05)}
  .stat-value{font-size:2rem;font-weight:bold;color:#3498db}
  .stat-label{color:#7f8c8d;font-size:.9rem;margin-top:5px}
  .errorlist{color:#e74c3c;list-style:none;font-size:.9rem;margin-top:5px}
</style>
</head>
<body>
<header>
  <div class="container">
    <h1><a href="{% url 'lista_cursos' %}">Termometro de Vaga</a></h1>
    <nav>
      <a href="{% url 'lista_cursos' %}" data-testid="nav-cursos">Cursos</a>
      <a href="{% url 'consultar_posicao' %}" data-testid="nav-posicao">Minha Posicao</a>
    </nav>
  </div>
</header>
<div class="container">
  {% if messages %}
  <div class="messages">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}" data-testid="msg-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
